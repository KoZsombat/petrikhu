# Deploys to the EC2 server (https://petriknew.zsombor.dev) after CI passes on main, or on demand.
#
# Over SSH, in /petrik on the server: a database backup first (migrations run on start), then git pull,
# docker compose up -d --build, and a wait until /healthz answers again.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST        server hostname or IP (port 22 must be reachable from GitHub Actions)
#   EC2_USER        SSH user that owns /petrik and may run docker
#   EC2_SSH_KEY     private key of a deploy key whose public half is in that user's ~/.ssh/authorized_keys
#   EC2_KNOWN_HOSTS optional but recommended: the output of `ssh-keyscan <host>`, to pin the host key
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never two deploys at once; a newer one waits for the running one instead of cancelling it mid-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SITE_URL: https://petriknew.zsombor.dev
  DEPLOY_PATH: /petrik

jobs:
  deploy:
    # Only after a successful CI run of a push to main (not of a pull request), or a manual run.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$EC2_KNOWN_HOSTS" ]; then
            printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::EC2_KNOWN_HOSTS is not set; trusting the host key on first use"
            ssh-keyscan -T 15 "$EC2_HOST" > ~/.ssh/known_hosts
          fi

      - name: Deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          # The commit CI tested (manual runs deploy whatever main is now).
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 "$EC2_USER@$EC2_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          echo "== backup before deploying (migrations run on start)"
          docker compose run --rm backup once

          echo "== update code"
          git fetch --prune origin main
          git checkout main
          git merge --ff-only origin/main
          if [ -n "$EXPECTED_SHA" ] && [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "main moved on since CI ran ($EXPECTED_SHA); deploying $(git rev-parse --short HEAD), its own CI run deploys again"
          fi

          echo "== rebuild and restart"
          docker compose up -d --build --remove-orphans
          docker image prune -f >/dev/null
          git log -1 --format='deployed %h %s'
          REMOTE

      - name: Wait for the site
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 10 "$SITE_URL/healthz" | grep -q '"ok":true'; then
              echo "up after $attempt checks"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE_URL/healthz did not come back within 5 minutes"
          exit 1

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
