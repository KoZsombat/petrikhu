name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
        env:
          PUBLIC_SITE_URL: https://petrik.hu

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Validate production compose file
        run: docker compose -f compose.prod.yaml config --quiet
        env:
          SITE_ORIGIN: https://ci.example.com
          ADMIN_ORIGIN: https://admin.ci.example.com
          POSTGRES_USER: petrik
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: petrik
          BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-password-123
          # `tunnel` declares its token with `:?`; any non-empty value passes `compose config`.
          CLOUDFLARE_TUNNEL_TOKEN: ci-placeholder

      - name: Build images
        run: docker compose build
