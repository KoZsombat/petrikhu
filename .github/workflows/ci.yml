# Lint, type-check, build every app, run the API tests against Postgres 17, then the Playwright smoke tests.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: petrik
          POSTGRES_PASSWORD: petrik
          POSTGRES_DB: petrik_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U petrik -d petrik_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://petrik:petrik@localhost:5432/petrik_test
      E2E_DATABASE_URL: postgres://petrik:petrik@localhost:5432/petrik_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Next.js builds and runs on Node (as in the Docker image).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # pg_dump / pg_restore matching the server (17), so the backup test runs instead of skipping.
      - name: PostgreSQL 17 client
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
      - name: Playwright browser
        run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
