# Development, one command:  docker compose -f docker-compose.dev.yml up
#   public site (Next.js dev):  http://localhost:4000      admin (Vite, HMR):  http://localhost:5173/admin/
#   API directly:               http://localhost:4001      Postgres:           127.0.0.1:5432 (petrik / petrik)
# The repository is bind-mounted, so edits apply live. node_modules lives in its own volume.
# An empty database gets the demo accounts (igazgato, helyettes, mk.vezeto; passwords in apps/server/src/lib/seed.ts).
x-bun: &bun
  image: oven/bun:1.4.4
  working_dir: /app
  volumes:
    - .:/app
    - node_modules:/app/node_modules

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: petrik
      POSTGRES_PASSWORD: petrik
      POSTGRES_DB: petrik
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petrik -d petrik"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: installs the dependencies into the shared node_modules volume.
  deps:
    <<: *bun
    command: bun install --frozen-lockfile

  api:
    <<: *bun
    depends_on:
      postgres: { condition: service_healthy }
      deps: { condition: service_completed_successfully }
    command: bun --watch apps/server/src/index.ts
    environment:
      DATABASE_URL: postgres://petrik:petrik@postgres:5432/petrik
      PNW_API_PORT: "4001"
      PNW_SEED_PASSWORD: ${PNW_SEED_PASSWORD:-}
    ports: ["127.0.0.1:4001:4001"]

  web:
    # Next.js runs on Node; the image only needs bun to start the script.
    image: node:24-slim
    working_dir: /app/apps/client
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      deps: { condition: service_completed_successfully }
    command: node /app/node_modules/next/dist/bin/next dev --port 4000 --hostname 0.0.0.0
    environment:
      PNW_API_URL: http://api:4001
    ports: ["127.0.0.1:4000:4000"]

  admin:
    <<: *bun
    working_dir: /app/apps/admin
    depends_on:
      deps: { condition: service_completed_successfully }
    command: bun run dev --host 0.0.0.0
    environment:
      VITE_SITE_URL: http://web:4000
    ports: ["127.0.0.1:5173:5173"]

volumes:
  pgdata-dev:
  node_modules:
